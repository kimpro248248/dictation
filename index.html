<meta charset="utf-8">
<title>받아쓰기 연습장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 왼쪽 설정 패널 + 오른쪽 A4 미리보기. 인쇄 시 패널은 숨김 */
:root{
  --paper:#ffffff; --desk:#eceee9; --ink:#23281f; --muted:#6b7266;
  --line:#9aa096; --guide:#c9cdc4; --accent:#2f6b4f; --accent-soft:#e3efe8; --warn:#b4472e;
  --trace:#c4c4c4;
  --hand:'학교안심 받아쓰기 TTF L','학교안심 받아쓰기','학교안심받아쓰기','HakgyoansimBadasseugiTTF-L','Gowun Dodum',sans-serif;
  --ui:'Noto Sans KR','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:light}
html,body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--ui);font-size:14px}
.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
aside{background:var(--paper);border-right:1px solid #d9dcd4;padding:22px 20px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--hand);font-size:26px;margin:0;font-weight:400;letter-spacing:.02em}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.grp{display:flex;flex-direction:column;gap:7px}
.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.seg{display:flex;border:1px solid #cfd3ca;border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:1px solid #cfd3ca}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.seg button:focus-visible,.btn:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:10px}
input[type=number]{width:70px;padding:7px 8px;border:1px solid #cfd3ca;border-radius:6px;font:inherit}
input[type=range]{flex:1;accent-color:var(--accent)}
textarea{width:100%;min-height:120px;resize:vertical;padding:9px;border:1px solid #cfd3ca;border-radius:8px;font:inherit;font-size:13.5px;line-height:1.6}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.hint b{color:var(--ink)}
.warn{color:var(--warn)}
.btns{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.btn{flex:1;padding:12px 8px;border-radius:8px;border:1px solid var(--accent);background:var(--paper);color:var(--accent);font:inherit;font-weight:700;font-size:14.5px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
.btn:hover{filter:brightness(.95)}
.btn:disabled{opacity:.6;cursor:wait}
.fontstat{font-size:12px;padding:8px 10px;border-radius:6px;background:var(--accent-soft);color:var(--accent);line-height:1.5}
.fontstat.no{background:#f8ebe7;color:var(--warn)}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}

main{padding:28px;display:flex;flex-direction:column;align-items:center;gap:28px;min-width:0}
.pagewrap{box-shadow:0 2px 14px rgba(30,40,25,.18)}
.page{width:210mm;height:297mm;background:#fff;padding:12mm 10mm 0;position:relative;overflow:hidden}
.pno{position:absolute;bottom:6mm;right:10mm;font-size:9pt;color:#aaa}
.sheet{display:grid;grid-template-columns:auto auto;border:0.3mm solid var(--line);width:max-content;margin:0 auto}
.half{display:grid}
.half+.half{border-left:0.3mm solid var(--line)}
.line{display:flex;border-bottom:0.2mm solid var(--line)}
.line:last-child{border-bottom:0}
.box{flex:none;width:var(--bx);height:var(--bx);position:relative;display:flex;align-items:center;justify-content:center;border-left:0.15mm solid var(--line)}
.box:first-child{border-left:0}
.box.g::before,.box.g::after{content:"";position:absolute;pointer-events:none}
.box.g::before{left:0;right:0;top:50%;border-top:0.15mm dashed var(--guide)}
.box.g::after{top:0;bottom:0;left:50%;border-left:0.15mm dashed var(--guide)}
.box span{font-family:var(--hand);font-size:calc(var(--bx) * 0.66);line-height:1;color:var(--trace);position:relative;z-index:1}
.box.w{background:transparent}
.box.sep{border-left:0.3mm solid var(--line)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid #d9dcd4}
  main{padding:16px}
}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff}
  aside{display:none}
  .app{display:block}
  main{padding:0;gap:0;display:block}
  .pagewrap{box-shadow:none;zoom:1 !important;break-after:page}
  .pagewrap:last-child{break-after:auto}
  .box span{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="app">
<aside>
  <div>
    <h1>받아쓰기 연습장</h1>
    <div class="sub">설정을 고르고 [인쇄하기]를 누르면 돼</div>
  </div>

  <div class="grp">
    <div class="lbl">글자 수</div>
    <div class="seg" id="len">
      <button data-v="2">2글자</button><button data-v="3">3글자</button><button data-v="mix">섞어서</button>
    </div>
    <div class="hint" id="lenHint"></div>
  </div>

  <div class="grp">
    <div class="lbl">단어 가져올 곳</div>
    <div class="seg" id="src">
      <button data-v="bank">기본 단어장</button><button data-v="mine">내 단어</button><button data-v="both">둘 다</button>
    </div>
    <div id="mineBox" class="grp">
      <textarea id="mine" placeholder="띄어쓰기, 쉼표, 줄바꿈으로 구분해서 입력&#10;예) 사과 바나나 하늘 무지개"></textarea>
      <div class="hint" id="mineHint"></div>
    </div>
  </div>

  <div class="grp">
    <div class="lbl">순서</div>
    <div class="seg" id="order">
      <button data-v="rand">무작위</button><button data-v="seq">순서대로</button>
    </div>
    <div class="row" id="startRow"><span class="hint">시작 번호</span><input type="number" id="start" min="1" value="1"></div>
  </div>

  <div class="grp">
    <div class="lbl">칸 크기 (정사각형)</div>
    <div class="seg" id="size">
      <button data-v="big">큰 칸</button><button data-v="mid">보통</button><button data-v="small">작은 칸</button>
    </div>
    <div class="hint" id="sizeHint"></div>
  </div>

  <div class="grp">
    <div class="lbl">장 수</div>
    <div class="row"><input type="number" id="pages" min="1" max="20" value="1"><span class="hint">장 (장끼리 단어 안 겹침)</span></div>
  </div>

  <div class="grp">
    <div class="lbl">회색 따라쓰기 글씨</div>
    <div class="seg" id="trace">
      <button data-v="1">첫 칸만</button><button data-v="all">모든 칸</button><button data-v="0">없음(시험)</button>
    </div>
    <div class="row"><span class="hint">연하게</span><input type="range" id="shade" min="120" max="230" value="196"><span class="hint">진하게</span></div>
    <label class="chk"><input type="checkbox" id="guide" checked> 칸 안에 십자 안내선</label>
  </div>

  <div class="fontstat" id="fontstat">글꼴 확인 중…</div>

  <div class="fontstat" id="note" hidden></div>
  <div class="hint" id="printHint" hidden>[PDF 받기]를 누르면 지금 화면 그대로 PDF로 저장돼. 받은 PDF를 열어서 인쇄하면 돼.</div>
  <div class="btns">
    <button class="btn" id="shuffle">새로 섞기</button>
    <button class="btn primary" id="print">인쇄하기</button>
  </div>
</aside>
<main id="pages-out"></main>
</div>

let seed = Date.now(), lastWords = [];
function rng(){ seed = (seed*1664525 + 1013904223) % 4294967296; return seed/4294967296; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function myWords(){ return st.mine.split(/[\s,，、·]+/).map(w=>w.trim()).filter(Boolean); }
function okLen(w){ const n=[...w].length; return st.len==='mix' ? (n===2||n===3) : n===Number(st.len); }

function pool(){
  const bank = st.len==='2' ? BANK['2'] : st.len==='3' ? BANK['3'] : BANK['2'].concat(BANK['3']);
  const mine = myWords().filter(okLen);
  const p = st.src==='bank' ? bank : st.src==='mine' ? mine : mine.concat(bank);
  return [...new Set(p)];
}

function pick(){
  const p = pool(), need = st.pages*geo().per;
  if(!p.length) return [];
  let out=[];
  if(st.order==='rand'){ seed = seed || 1; while(out.length<need) out = out.concat(shuffle(p)); }
  else { const s=Math.max(0,(st.start||1)-1); for(let i=0;i<need;i++) out.push(p[(s+i)%p.length]); }
  return out.slice(0,need);
}

const BOXES = { '2':{big:6,mid:8,small:10}, '3':{big:6,mid:9,small:12}, 'mix':{big:6,mid:9,small:12} };
function geo(){
  const n = BOXES[st.len][st.size] || BOXES[st.len].mid;
  const bx = 190/(2*n);              // 가로 190mm를 꽉 채우는 정사각형 한 변
  const rows = Math.floor(272/bx);   // A4 세로에 들어가는 줄 수
  return {n, bx, rows, per: rows*2};
}

function cells(word, mixMode){
  const ch=[...(word||'')];
  const n = geo().n;
  const L = ch.length || (mixMode?3:Number(st.len));
  const reps = Math.floor(n / L), out=[];
  for(let i=0;i<n;i++){
    const k=Math.floor(i/L), c = k<reps ? ch[i%L] : '';
    out.push({ c: (word && c && (st.trace==='all' || (st.trace==='1' && k===0))) ? c : '',
               g: st.guide && !(k===0 && st.trace!=='0'),
               sep: i>0 && i%L===0 && k<=reps });
  }
  return out;
}
function lineHTML(word, mixMode){
  return `<div class="line">${cells(word,mixMode).map(x=>`<div class="box${x.g?' g':''}${x.sep?' sep':''}">${x.c?`<span>${x.c}</span>`:''}</div>`).join('')}</div>`;
}

  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const x=cv.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,W,H);
  const g=geo(), bx=g.bx*k, left=10*k, top=12*k, mix=st.len==='mix';
  const tint=`rgb(${st.shade},${st.shade},${st.shade})`;
  x.textAlign='center'; x.textBaseline='middle';
  x.font=`${bx*0.66}px ${HAND}`;
  for(let half=0;half<2;half++){
    for(let r=0;r<g.rows;r++){
      const cs=cells(words[half*g.rows+r],mix), y=top+r*bx;
      cs.forEach((cl,i)=>{
        const x0=left+(half*g.n+i)*bx;
        if(cl.g){ x.save(); x.strokeStyle='#c9cdc4'; x.lineWidth=0.15*k; x.setLineDash([0.8*k,0.6*k]);
          x.beginPath(); x.moveTo(x0,y+bx/2); x.lineTo(x0+bx,y+bx/2); x.moveTo(x0+bx/2,y); x.lineTo(x0+bx/2,y+bx); x.stroke(); x.restore(); }
        if(cl.c){ x.fillStyle=tint; x.fillText(cl.c, x0+bx/2, y+bx/2+bx*0.03); }
        x.strokeStyle='#9aa096'; x.lineWidth=(cl.sep?0.3:0.15)*k;
        if(i>0){ x.beginPath(); x.moveTo(x0,y); x.lineTo(x0,y+bx); x.stroke(); }
      });
    }
  }
  // 가로줄 + 바깥 테두리 + 가운데 세로선
  x.strokeStyle='#9aa096'; x.lineWidth=0.2*k;
  for(let r=1;r<g.rows;r++){ x.beginPath(); x.moveTo(left,top+r*bx); x.lineTo(left+2*g.n*bx,top+r*bx); x.stroke(); }
  x.lineWidth=0.3*k; x.strokeRect(left,top,2*g.n*bx,g.rows*bx);
  x.beginPath(); x.moveTo(left+g.n*bx,top); x.lineTo(left+g.n*bx,top+g.rows*bx); x.stroke();
  return cv;
}
async function makePDF(){
  try{ await document.fonts.load(`40px ${HAND}`,'가'); await document.fonts.ready; }catch(e){}
  const { jsPDF } = window.jspdf;
  const pdf=new jsPDF({unit:'mm',format:'a4',compress:true});
  const g=geo();
  for(let p=0;p<st.pages;p++){
    if(p) pdf.addPage();
    const cv=drawPage(lastWords.slice(p*g.per,(p+1)*g.per));
    pdf.addImage(cv.toDataURL('image/png'),'PNG',0,0,210,297,undefined,'FAST');
  }
  return pdf.output('blob');
}

function render(){
  document.documentElement.style.setProperty('--bx', geo().bx.toFixed(3)+'mm');
  document.documentElement.style.setProperty('--trace', `rgb(${st.shade},${st.shade},${st.shade})`);
  const words = lastWords = pick(), out=$('#pages-out'); out.innerHTML='';
  const mix = st.len==='mix';
  for(let p=0;p<st.pages;p++){
    const g = geo(), w = words.slice(p*g.per,(p+1)*g.per);
    let L='',R='';
    for(let r=0;r<g.rows;r++){ L+=lineHTML(w[r],mix); R+=lineHTML(w[g.rows+r],mix); }
    const div=document.createElement('div'); div.className='pagewrap';
    div.innerHTML=`<div class="page"><div class="sheet"><div class="half">${L}</div><div class="half">${R}</div></div>${st.pages>1?`<div class="pno">${p+1} / ${st.pages}</div>`:''}</div>`;
    out.appendChild(div);
  }
  fit(); ui();
}

function fit(){
  const main=$('#pages-out'); const avail = main.clientWidth - 32;
  const px = 210*96/25.4; const z = Math.min(1, avail/px);
  document.querySelectorAll('.pagewrap').forEach(e=>e.style.zoom = z);
}

function ui(){
  for(const id of ['len','src','order','trace','size'])
    document.querySelectorAll(`#${id} button`).forEach(b=>b.classList.toggle('on', b.dataset.v===String(st[id])));
  { const g=geo(); $('#sizeHint').innerHTML = `한 칸 ${g.bx.toFixed(1)}mm · 한 장에 <b>${g.per}단어</b> (${g.rows}줄 × 2)`; }
  $('#mineBox').hidden = st.src==='bank';
  $('#startRow').hidden = st.order!=='seq';
  const p = pool();
  const lenTxt = st.len==='2'?'2글자':st.len==='3'?'3글자':'2·3글자';
  $('#lenHint').innerHTML = `사용할 수 있는 ${lenTxt} 단어 <b>${p.length}개</b>` + ` · 한 줄에 ${Math.floor(geo().n/(st.len==='3'?3:2))}번 반복`;
  const m = myWords(), bad = m.filter(w=>!okLen(w));
  $('#mineHint').innerHTML = `입력 ${m.length}개` + (bad.length?` · <span class="warn">글자 수가 안 맞아 빠진 단어 ${bad.length}개: ${bad.slice(0,8).join(', ')}${bad.length>8?' …':''}</span>`:'');
  if(!p.length) $('#lenHint').innerHTML += ` <span class="warn">— 단어가 없어. 내 단어를 입력하거나 기본 단어장을 골라줘</span>`;
}

function bindSeg(id, key){ document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{ st[key]=b.dataset.v; save(); render(); }); }
bindSeg('len','len'); bindSeg('src','src'); bindSeg('order','order'); bindSeg('trace','trace'); bindSeg('size','size');
$('#pages').oninput=e=>{ st.pages=Math.max(1,Math.min(20,parseInt(e.target.value)||1)); save(); render(); };
$('#start').oninput=e=>{ st.start=Math.max(1,parseInt(e.target.value)||1); save(); render(); };
$('#shade').oninput=e=>{ st.shade=+e.target.value; save(); document.documentElement.style.setProperty('--trace',`rgb(${st.shade},${st.shade},${st.shade})`); };
$('#guide').onchange=e=>{ st.guide=e.target.checked; save(); render(); };
let t; $('#mine').oninput=e=>{ st.mine=e.target.value; save(); clearTimeout(t); t=setTimeout(render,300); };
$('#shuffle').onclick=()=>{ seed = Date.now() % 4294967296; render(); };
const inFrame = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
const note = msg => { $('#note').hidden=!msg; $('#note').innerHTML=msg||''; };
if(inFrame){
  // 웹사이트(Claude 링크)에서는 인쇄 창을 못 띄워서 PDF로 받아서 인쇄
  $('#print').textContent='PDF 받기';
  $('#printHint').hidden=false;
  $('#print').onclick=async()=>{
    const btn=$('#print'); btn.disabled=true; btn.textContent='만드는 중…'; note('');
    try{
      if(!window.jspdf) throw {code:'nolib'};
      const dl = await (window.claude?.use ? window.claude.use('downloads') : null);
      if(!dl) throw {code:'unavailable'};
      const blob = await makePDF();
      const d=new Date(), name=`받아쓰기_${d.getMonth()+1}월${d.getDate()}일.pdf`;
      await dl.save({filename:name, data:blob});
      note('PDF를 받았어. 열어서 인쇄하면 돼 (배율 100% / 실제 크기).');
    }catch(e){
      if(e && e.code==='declined') note('');
      else if(e && e.code==='rate_limited') note('저장 창이 이미 열려 있어. 잠시 후 다시 눌러줘.');
      else note('이 화면에서는 PDF 저장이 안 돼. 바탕화면의 받아쓰기_연습장.html을 크롬으로 열어서 인쇄해줘.');
    }finally{ btn.disabled=false; btn.textContent='PDF 받기'; }
  };
} else {
  $('#print').onclick=()=>{ try{ window.print(); }catch(e){} };
}
window.addEventListener('resize', fit);

$('#pages').value=st.pages; $('#start').value=st.start; $('#shade').value=st.shade; $('#guide').checked=st.guide; $('#mine').value=st.mine;
